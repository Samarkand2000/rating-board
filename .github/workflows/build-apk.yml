name: Build TV APK

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "android-tv/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          yes | sdkmanager --licenses

      - name: Create local.properties
        working-directory: android-tv
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Setup Gradle wrapper
        working-directory: android-tv
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget -q https://services.gradle.org/distributions/gradle-7.6.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          /tmp/gradle/gradle-7.6.4/bin/gradle wrapper

      - name: Build APK
        working-directory: android-tv
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rating-board-tv
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk

      - name: Remove old release tag
        run: |
          gh release delete tv-app-latest -y 2>/dev/null || true
          git push origin :refs/tags/tv-app-latest 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-app-latest
          name: Рейтинг BVB для TV
          body: APK для Xiaomi / Android TV. Установите один раз — данные из Google Таблицы обновляются сами.
          files: android-tv/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
