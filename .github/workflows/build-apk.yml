name: Build TV APK

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "android-tv/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Build APK
        working-directory: android-tv
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rating-board-tv
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-app-latest
          name: Рейтинг BVB для TV
          body: APK для установки на Xiaomi / Android TV. Данные подтягиваются из Google Таблицы автоматически.
          files: android-tv/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
