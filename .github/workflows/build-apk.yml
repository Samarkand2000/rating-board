name: Build TV APK

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "android-tv/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Create local.properties
        working-directory: android-tv
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        working-directory: android-tv
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rating-board-tv
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk

      - name: Remove old release tag
        run: |
          gh release delete tv-app-latest -y 2>/dev/null || true
          git push origin :refs/tags/tv-app-latest 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-app-latest
          name: Рейтинг BVB для TV
          body: APK для Xiaomi / Android TV. Установите один раз — данные из Google Таблицы обновляются сами.
          files: android-tv/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
